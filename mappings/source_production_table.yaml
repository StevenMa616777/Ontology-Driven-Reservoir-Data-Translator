mapping_version: "0.2.0"
source_system: production_role_table
activation_terms: [Field, Block, Well_No, Role, Operating_Target_bbl_d, BHP_Limit_psi, Limit_Type]
instructions: "Within this source schema, Well_No is the local simulator well ID; Field and Block remain source identity qualifiers in provenance. PROD means producer with a liquid-rate target; WINJ means water injector with a water-injection-rate target. Operating_Target_bbl_d is bbl/day, BHP_Limit_psi is psi. MIN/MAX choose minimum/maximum BHP. Never merge the same Well_No from different Field/Block identities: mark that identity ambiguous. Do not independently map already consumed Role/Limit_Type/unit qualifiers."
entries:
  - source_term: Well_No
    concept_id: well
  - source_term: PROD
    concept_id: well.producer
  - source_term: WINJ
    concept_id: well.water_injector
  - source_term: BHP_Limit_psi
    concept_id: well.constraint.minimum_bhp
  - source_term: MAX
    concept_id: well.constraint.maximum_bhp
